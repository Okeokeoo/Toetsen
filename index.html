<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f6edff"><title>Toetsavontuur</title><style>
:root{font-family:ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;color:#27304a;background:#f7f2ff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{border:0;cursor:pointer;border-radius:15px;padding:12px 16px;font-weight:800;background:#7456dc;color:white}button.alt{background:#eee8ff;color:#5942a2}button.warn{background:#ffe5e6;color:#ad3b52}button:disabled{opacity:.5}main{max-width:750px;margin:auto;padding:18px 15px 110px}.hero{background:linear-gradient(120deg,#b3e7ef,#e4c8ff 70%,#ffe8b5);padding:22px;border-radius:26px;margin-bottom:15px}.hero h1{margin:0;font-size:27px}.muted{color:#73758c;font-size:13px}.card{background:white;border-radius:23px;padding:17px;margin:13px 0;box-shadow:0 5px 18px #4632800c}.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{padding:9px 12px;font-size:13px}.chip{background:#f2e9ff;color:#6446ae;border-radius:30px;padding:7px 10px;font-size:12px;font-weight:800}.urgent{background:#ffe3dc;color:#a64e32}.progress{height:12px;background:#eae5f5;border-radius:50px;overflow:hidden;margin:10px 0}.fill{height:100%;background:linear-gradient(90deg,#65c8b5,#8a6ae9);border-radius:50px}.steps{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.step{width:43px;height:43px;display:grid;place-items:center;border-radius:15px;background:#ede8f5;font-size:23px}.step.got{background:#e1f7e9}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffef9;border-top:1px solid #ece6f7;display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}.nav button{background:transparent;color:#6e638a;border-radius:0;padding:12px 14px;font-size:12px;min-width:78px}.nav button.active{color:#7046cb;background:#f3edff}h2{font-size:20px;margin:20px 0 10px}h3{margin:0 0 5px}p{line-height:1.5}label{display:block;font-weight:750;font-size:13px;margin:13px 0 6px}input,select{border:2px solid #e3ddf2;background:white;border-radius:12px;padding:12px;width:100%;color:#292d47}input[type=number]{max-width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{background:#f7f3ff;border-radius:16px;padding:13px}.big{font-size:33px}.map{border-radius:23px;padding:20px 10px;background:linear-gradient(#c9eff6,#d9f5d2 60%,#f9e7b6);text-align:center;overflow:hidden}.mapPath{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:9px;max-width:410px;margin:16px auto}.node{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#ffffffaa;border:3px dashed #a5b8a5;font-size:24px}.node.done{background:#fff1a4;border:3px solid #e9ba4b}.node.here{box-shadow:0 0 0 5px #9271ed55}.timer{font-variant-numeric:tabular-nums;font-size:44px;font-weight:900;text-align:center;margin:12px}.overlay{position:fixed;inset:0;background:#25203a99;display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}.dialog{background:white;border-radius:24px;padding:20px;width:min(100%,440px);max-height:90vh;overflow:auto}.dialog h2{margin-top:0}.reward{text-align:center}.reward .big{font-size:80px;animation:pop .65s ease}@keyframes pop{0%{transform:scale(.35) rotate(-15deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}.animal{font-size:40px}.tiny{font-size:12px}.line{border-bottom:1px solid #f0ecf6;padding:10px 0}.hide{display:none}.footnote{font-size:12px;color:#75758a;margin-top:15px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e9ad54} .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#3e346b;color:white;padding:12px 18px;border-radius:18px;z-index:20;max-width:90%}
</style></head><body><main id="app"></main><div id="nav" class="nav"></div><div id="overlay"></div><script>
(()=>{'use strict';const OLD='toetsapp_v1',KEY='toetsavontuur_v2';let db;const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const blank=()=>({subjects:[],tests:[],sessions:[],character:'🦉',adventure:{claimed:0,items:[],selected:null,goalClaims:[]}});try{db=JSON.parse(localStorage.getItem(KEY));if(!db){db=blank();const old=JSON.parse(localStorage.getItem(OLD)||'null');if(old){db.subjects=old.subjects||[];db.tests=(old.tests||[]).map(t=>({...t,goalCount:5,goalMinutes:10}));db.sessions=(old.sessions||[]).map(s=>({...s,seconds:Math.max(0,Number(s.minutes)||0)*60}));}}}catch{db=blank()}for(const k of ['subjects','tests','sessions'])if(!Array.isArray(db[k]))db[k]=[];db.adventure??={claimed:0,items:[],selected:null,goalClaims:[]};db.adventure.items??=[];db.adventure.goalClaims??=[];db.adventure.claimed??=0;for(const s of db.sessions)if(s.seconds==null)s.seconds=Math.max(0,Number(s.minutes)||0)*60;
let page='home',subjectId=null,testId=null,modal=null,timer=null,queued=[];const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Opslaan mislukt. Controleer de opslagruimte.')}},sub=id=>db.subjects.find(x=>x.id===id),test=id=>db.tests.find(x=>x.id===id),secs=id=>db.sessions.filter(s=>s.testId===id).reduce((a,s)=>a+Math.max(0,Number(s.seconds)||0),0),total=()=>db.sessions.reduce((a,s)=>a+Math.max(0,Number(s.seconds)||0),0),fmt=n=>{n=Math.floor(Math.max(0,n)/60);return n>=60?`${Math.floor(n/60)}u ${n%60}m`:`${n} min`},clock=n=>{n=Math.floor(Math.max(0,n));return [Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(v=>String(v).padStart(2,'0')).join(':')},today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},days=s=>{const [y,m,d]=s.split('-').map(Number),n=new Date();return Math.round((Date.UTC(y,m-1,d)-Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))/86400000)},date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'}):'',done=t=>t.grade!==null&&t.grade!==undefined&&t.grade!=='',goal=t=>Math.max(1,Number(t.goalCount)||5)*Math.max(1,Number(t.goalMinutes)||10)*60,award=t=>Math.floor(secs(t.id)/goal(t)),worlds=[['🌳','Betoverde Bos'],['🐠','Oceaanrijk'],['☁️','Wolkenrijk'],['💎','Kristalgrotten'],['🌋','Vulkaneneiland'],['🌙','Sterrenrijk']],creatures=['🐉','🦊','🦉','🦎','🐢','🦋','🐼','🐧','🦄','🐙','🦜','🐸','🦖','🦦','🐺','🦇'],treasures=['💎','🔮','🪄','👑','🧭','🪙','🪶','🌈','🗝️','⭐'];const choose=a=>a[Math.floor(Math.random()*a.length)];function currentSeconds(){return timer?Math.max(0,Date.now()-timer.start)/1000:0}function storeTimer(){try{if(timer)localStorage.setItem(KEY+'_timer',JSON.stringify(timer));else localStorage.removeItem(KEY+'_timer')}catch{}}try{const t=JSON.parse(localStorage.getItem(KEY+'_timer'));if(t&&test(t.testId)&&Number.isFinite(t.start)&&t.start<=Date.now())timer=t}catch{};
function rewardCheck(){// Award once for each new complete 10-minute block of recorded time, not for merely starting a timer.
const blocks=Math.floor(total()/600);while(db.adventure.claimed<blocks){db.adventure.claimed++;const i=db.adventure.claimed;let item;if(i%3===0){item={id:uid(),type:'egg',emoji:'🥚',progress:0,need:3,creature:choose(creatures),rare:Math.random()<.12};queued.push({emoji:'🥚',title:'Een mysterieus ei!',desc:'Nog 3 nieuwe stappen leren om het ei uit te broeden.'})}else{item={id:uid(),type:'treasure',emoji:choose(treasures),rare:Math.random()<.12};queued.push({emoji:item.emoji,title:item.rare?'SUPERZELDZAME SCHAT!':'Schat gevonden!',desc:'Je hebt een verrassing ontdekt op de kaart!'})}db.adventure.items.push(item);const active=db.adventure.items.find(x=>x.id===db.adventure.selected&&x.type==='creature')||db.adventure.items.find(x=>x.type==='creature'&&x.stage<3);if(active){active.xp=(active.xp||0)+1;if(active.xp>=4&&active.stage<3){active.xp=0;active.stage++;queued.push({emoji:active.emoji,title:'Je dier is gegroeid!',desc:`Groeifase ${active.stage} van 3!`});if(active.stage===3){const gift={id:uid(),type:'treasure',emoji:choose(treasures),rare:true};db.adventure.items.push(gift);queued.push({emoji:gift.emoji,title:'Cadeau van je dier!',desc:'Je volwassen dier heeft een bijzondere schat gevonden.'})}}}for(const egg of db.adventure.items.filter(x=>x.type==='egg')){if(egg.id!==item.id){egg.progress++;if(egg.progress>=egg.need){egg.type='creature';egg.emoji=egg.creature;egg.stage=1;egg.xp=0;queued.push({emoji:egg.emoji,title:'Het ei is uitgekomen!',desc:'Een nieuw magisch dier voor je verzamelboek!'})}}}if(i%50===0)queued.push({emoji:'🏆',title:'Wereld voltooid!',desc:'Je hebt een nieuwe wereld vrijgespeeld!'});}
for(const t of db.tests){if(secs(t.id)>=goal(t)&&!db.adventure.goalClaims.includes(t.id)){db.adventure.goalClaims.push(t.id);const gift={id:uid(),type:'treasure',emoji:'🗝️',rare:true,goalTest:t.id};db.adventure.items.push(gift);queued.push({emoji:'🗝️',title:'LEERDOEL BEHAALD!',desc:`${t.name}: je hebt een gouden sleutel verdiend!`})}}save()}
function bar(a,b){return `<div class="progress"><div class="fill" style="width:${Math.min(100,100*a/Math.max(1,b))}%"></div></div>`}function header(title,desc){return `<div class="hero"><h1>${title}</h1><div class="muted">${desc}</div></div>`}function button(txt,act,cls='alt'){return `<button class="${cls}" data-act="${esc(act)}">${txt}</button>`}function testCard(t){const s=sub(t.subjectId),n=days(t.date),m=secs(t.id),g=goal(t),parts=Math.floor(m/(Math.max(1,Number(t.goalMinutes)||10)*60));return `<div class="card"><div class="row"><div><h3>${esc(s?.name||'Vak')} · ${esc(t.name)}</h3><div class="muted">📅 ${date(t.date)}</div></div><span class="chip ${n<=2?'urgent':''}">${n>0?n+' dagen':n===0?'Vandaag':'Datum voorbij'}</span></div><div class="muted" style="margin-top:9px">⏱ ${fmt(m)} geleerd · ${Math.min(parts,Number(t.goalCount)||5)} / ${Number(t.goalCount)||5} leerstappen</div>${bar(m,g)}<div class="actions">${button('📖 Leren','openTest:'+t.id)}</div></div>`}
function home(){let active=db.tests.filter(t=>!done(t)).sort((a,b)=>a.date.localeCompare(b.date));return header('✨ Mijn Toetsavontuur',`${db.character||'🦉'} Leer, ontdek en verzamel magische schatten!`)+`<div class="card"><div class="row"><div><b>🗺️ Avonturenkaart</b><div class="muted">${db.adventure.claimed} stappen gezet</div></div>${button('Ontdekken →','nav:map')}</div></div><div class="row"><h2>📚 Mijn toetsen</h2>${button('＋ Toets','addTest','')}</div>`+(active.length?active.map(testCard).join(''):'<div class="card">🎉 Geen aankomende toetsen! Voeg een toets toe om te beginnen.</div>')+`<div class="actions">${button('＋ Vak toevoegen','addSubject')}${button('Vakken & resultaten','nav:subjects')}</div>`}
function mapPage(){const count=db.adventure.claimed,wi=Math.floor(count/50)%worlds.length,world=worlds[wi],position=count%50,level=Math.floor(position/5)+1;let nodes='';for(let i=0;i<10;i++)nodes+=`<div class="node ${i<position%10?'done':''} ${i===position%10?'here':''}">${i===position%10?db.character:(i<position%10?'⭐':i%3===2?'🥚':'🎁')}</div>`;return header('🗺️ Avonturenkaart','Elke 10 volledige minuten = 1 stap')+`<div class="map"><div class="big">${world[0]}</div><h2>${world[1]}</h2><div>Wereldronde ${Math.floor(count/(50*worlds.length))+1} · Level ${level} van 10</div><div class="mapPath">${nodes}</div><div><b>${position}/50 stappen in deze wereld</b></div>${bar(position,50)}<div class="muted">Nog ${10-Math.floor(total()%600/60)} volledige minuten tot je volgende stap</div></div><div class="card"><h3>🎒 Jouw avonturier</h3><div class="big">${db.character||'🦉'}</div>${button('Personage kiezen','character')}<p class="muted">Alle leertijd van al je toetsen telt samen voor de kaart. Bij 50 stappen reis je naar een nieuwe wereld.</p></div>`}
function collection(){const items=db.adventure.items;return header('📖 Verzamelboek',`${items.length} ontdekkingen · dieren en schatten`)+`<div class="card"><h3>🐾 Magische dieren</h3><div class="grid">${items.filter(x=>x.type==='creature').map(x=>`<div class="tile"><div class="animal">${x.emoji}</div><b>${x.stage===1?'Baby':x.stage===2?'Jong':'Volwassen'} dier</b><div class="muted">${x.rare?'✨ Zeldzaam · ':''}Groeifase ${x.stage}/3 · ${x.xp||0}/4</div>${button(db.adventure.selected===x.id?'✓ Gekozen':'Laat groeien','selectAnimal:'+x.id)}</div>`).join('')||'<p class="muted">Nog geen dieren. Ontdek een ei op de kaart!</p>'}</div></div><div class="card"><h3>🥚 Eieren</h3><div class="grid">${items.filter(x=>x.type==='egg').map(x=>`<div class="tile"><div class="animal">🥚</div><div class="muted">${x.progress||0}/${x.need} stappen tot uitkomen</div></div>`).join('')||'<p class="muted">Nog geen eieren gevonden.</p>'}</div></div><div class="card"><h3>💎 Schatten</h3><div class="grid">${items.filter(x=>x.type==='treasure').map(x=>`<div class="tile"><div class="animal">${x.emoji}</div><div class="muted">${x.rare?'✨ Bijzonder':'Schat gevonden'}</div></div>`).join('')||'<p class="muted">Nog geen schatten gevonden.</p>'}</div></div>`}
function subjects(){return header('📚 Mijn vakken','Cijfers, toetsen en totale leertijd')+`<div class="actions">${button('＋ Vak','addSubject','')}</div>`+db.subjects.map(s=>{const ts=db.tests.filter(t=>t.subjectId===s.id),grades=ts.filter(done).map(t=>Number(t.grade)).filter(Number.isFinite),sum=ts.reduce((a,t)=>a+secs(t.id),0);return `<div class="card"><div class="row"><h3>${esc(s.name)}</h3>${button('Bekijken','openSubject:'+s.id)}</div><div class="muted">⏱ ${fmt(sum)} · ${grades.length} cijfers · gemiddelde ${grades.length?(grades.reduce((a,b)=>a+b,0)/grades.length).toLocaleString('nl-NL',{maximumFractionDigits:2}):'—'}</div></div>`}).join('')}
function subjectPage(){const s=sub(subjectId);if(!s)return subjects();const ts=db.tests.filter(t=>t.subjectId===s.id).sort((a,b)=>b.date.localeCompare(a.date)),gs=ts.filter(done).map(t=>Number(t.grade)).filter(Number.isFinite);return header('📘 '+esc(s.name),'Resultaten en toetsen')+`<div class="card"><div class="row"><div><b>⏱ ${fmt(ts.reduce((a,t)=>a+secs(t.id),0))}</b><div class="muted">Totaal geleerd</div></div><div><b>${gs.length?(gs.reduce((a,b)=>a+b,0)/gs.length).toLocaleString('nl-NL',{maximumFractionDigits:2}):'—'}</b><div class="muted">Gemiddelde</div></div></div><div class="actions">${button('Vak wijzigen','editSubject:'+s.id)}${button('Vak verwijderen','deleteSubject:'+s.id,'warn')}</div></div><h2>Alle toetsen en resultaten</h2>`+ts.map(t=>`<div class="card"><div class="row"><div><b>${esc(t.name)}</b><div class="muted">${date(t.date)} · ⏱ ${fmt(secs(t.id))}</div></div><span class="chip">${done(t)?'Cijfer '+Number(t.grade).toLocaleString('nl-NL'):'Nog geen cijfer'}</span></div><div class="actions">${button('Openen','openTest:'+t.id)}</div></div>`).join('')+`<div class="actions">${button('＋ Toets','addTest')}</div>`}
function testPage(){const t=test(testId);if(!t)return home();const s=sub(t.subjectId),m=secs(t.id),g=goal(t),chunk=Math.max(1,Number(t.goalMinutes)||10)*60,steps=Math.floor(m/chunk),remain=Math.floor((chunk-m%chunk)/60);let sessions=db.sessions.filter(x=>x.testId===t.id).sort((a,b)=>(b.created||0)-(a.created||0));return header('📖 '+esc(t.name),esc(s?.name||'')+' · '+date(t.date))+`<div class="card"><div class="row"><h3>🎯 Jouw leerdoel</h3><span class="chip">${Math.min(steps,Number(t.goalCount)||5)}/${Number(t.goalCount)||5} stappen</span></div><div><b>${t.goalCount||5} × ${t.goalMinutes||10} minuten</b></div>${bar(m,g)}<div class="steps">${Array.from({length:Math.min(20,Number(t.goalCount)||5)},(_,i)=>`<span class="step ${i<steps?'got':''}">${i<steps?'⭐':'🔒'}</span>`).join('')}</div><div class="muted">${fmt(m)} geleerd · ${m>=g?'🏆 Leerdoel behaald!':'Nog '+fmt(g-m)+' tot je leerdoel'} </div><p class="muted">Resterende tijd telt mee: ${clock(m%chunk)} / ${clock(chunk)} richting de volgende leerstap.</p></div><div class="card"><h3>⏱ Leertimer</h3><div id="clock" class="timer">${timer?.testId===t.id?clock(currentSeconds()):'00:00:00'}</div><div class="actions" style="justify-content:center">${timer?.testId===t.id?button('⏹ Stop en bewaar','stopTimer',''):button('▶ Start leren','startTimer','')}${timer?.testId===t.id?button('Annuleer','cancelTimer','warn'):''}</div><p class="footnote">Alleen volledig verstreken minuten verschijnen als hele minuten. Ook overgebleven seconden blijven exact bewaard voor later. De timer gebruikt de echte verstreken tijd, ook als je scherm uit is.</p></div><div class="card"><div class="row"><h3>📝 Cijfer</h3><b>${done(t)?Number(t.grade).toLocaleString('nl-NL'):'Nog niet ingevuld'}</b></div><div class="actions">${button(done(t)?'Cijfer wijzigen':'Cijfer toevoegen','grade:'+t.id)}${done(t)?button('Cijfer wissen','clearGrade:'+t.id,'warn'):''}</div></div><div class="card"><div class="row"><h3>📒 Leersessies</h3>${button('＋ Tijd toevoegen','addTime')}</div>${sessions.map(x=>`<div class="line row"><div><b>${fmt(x.seconds)}</b><div class="muted">${new Date(x.created||Date.now()).toLocaleDateString('nl-NL')} · ${clock(x.seconds)}${x.manual?' · handmatig':''}</div></div><div class="actions">${button('✏️','editTime:'+x.id)}${button('🗑️','deleteTime:'+x.id,'warn')}</div></div>`).join('')||'<p class="muted">Nog geen leersessies.</p>'}</div><div class="actions">${button('Toets wijzigen','editTest:'+t.id)}${button('Toets verwijderen','deleteTest:'+t.id,'warn')}</div>`}
function render(){let html=page==='home'?home():page==='map'?mapPage():page==='collection'?collection():page==='subjects'?subjects():page==='subject'?subjectPage():testPage();$('app').innerHTML=html;const nav=[['home','🏠','Toetsen'],['map','🗺️','Avontuur'],['collection','🥚','Verzamelen'],['subjects','📚','Vakken']];$('nav').innerHTML=nav.map(([v,e,n])=>`<button class="${page===v?'active':''}" data-act="nav:${v}">${e}<br>${n}</button>`).join('');renderModal();showReward()}
function renderModal(){const o=$('overlay');if(!modal){o.innerHTML='';return}let m=modal,t=test(m.id),s=sub(m.id),sess=db.sessions.find(x=>x.id===m.id),content='',title='';if(m.type==='subject'){title=m.id?'Vak wijzigen':'Nieuw vak';content=`<label>Naam vak</label><input id="fName" maxlength="60" value="${esc(s?.name||'')}">`}
if(m.type==='test'){title=m.id?'Toets wijzigen':'Nieuwe toets';content=`<label>Vak</label><select id="fSubject">${db.subjects.map(s=>`<option value="${esc(s.id)}" ${(t?.subjectId||subjectId)===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><label>Naam toets</label><input id="fName" maxlength="80" value="${esc(t?.name||'')}"><label>Toetsdatum</label><input id="fDate" type="date" value="${esc(t?.date||today())}"><label>Aantal leerstappen</label><input id="fCount" type="number" min="1" max="100" step="1" value="${t?.goalCount||5}"><label>Minuten per stap</label><input id="fMinutes" type="number" min="1" max="180" step="1" value="${t?.goalMinutes||10}"><p class="muted">Bijvoorbeeld 5 × 10 minuten. Elke 10 minuten van het grote avontuur levert een verrassing op.</p>`}
if(m.type==='time'){title=m.id?'Leertijd wijzigen':'Leertijd toevoegen';const n=sess?.seconds||0;content=`<label>Uren</label><input id="fHours" type="number" min="0" max="999" step="1" value="${Math.floor(n/3600)}"><label>Minuten</label><input id="fMinutes" type="number" min="0" max="59" step="1" value="${Math.floor(n%3600/60)}"><label>Seconden</label><input id="fSeconds" type="number" min="0" max="59" step="1" value="${Math.floor(n%60)}"><p class="muted">Je kunt een bestaande sessie volledig vervangen of verwijderen.</p>`}
if(m.type==='grade'){title='Cijfer invoeren';content=`<label>Cijfer (1 t/m 10)</label><input id="fGrade" type="number" min="1" max="10" step="0.1" value="${done(t)?t.grade:''}">`}
if(m.type==='character'){title='Kies je avonturier';content=`<div class="grid">${[['🐉','Draakje'],['🦊','Vosje'],['🦉','Uiltje'],['🦎','Axolotl']].map(([e,n])=>`<button class="alt" data-act="chooseCharacter:${e}" style="font-size:20px">${e}<br><span class="tiny">${n}</span></button>`).join('')}</div>`}
o.innerHTML=`<div class="overlay" data-act="closeBackdrop"><div class="dialog" role="dialog" aria-modal="true"><h2>${title}</h2>${content}<div class="actions">${m.type==='character'?'':button('Opslaan','submit','')}${button('Annuleren','close')}</div></div></div>`}
function showReward(){if(modal||!queued.length)return;const r=queued.shift();$('overlay').innerHTML=`<div class="overlay"><div class="dialog reward"><div class="big">${r.emoji}</div><h2>🎉 ${esc(r.title)}</h2><p>${esc(r.desc)}</p>${button('Verder op avontuur!','nextReward','')}</div></div>`}
function openModal(type,id=null){modal={type,id};renderModal()}
function submit(){const v=id=>$(id)?.value, m=modal;if(!m)return;const value=id=>String(v(id)||'').trim();if(m.type==='subject'){const name=value('fName');if(!name)return alert('Vul een vaknaam in.');if(m.id)sub(m.id).name=name;else db.subjects.push({id:uid(),name,color:'#8465d9'})}
if(m.type==='test'){const name=value('fName'),dt=value('fDate'),subject=value('fSubject'),count=Number(v('fCount')),mins=Number(v('fMinutes'));if(!name||!dt||!subject||!Number.isInteger(count)||count<1||count>100||!Number.isInteger(mins)||mins<1||mins>180)return alert('Vul alle gegevens goed in.');if(m.id)Object.assign(test(m.id),{name,date:dt,subjectId:subject,goalCount:count,goalMinutes:mins});else db.tests.push({id:uid(),name,date:dt,subjectId:subject,goalCount:count,goalMinutes:mins,grade:null})}
if(m.type==='grade'){const n=Number(value('fGrade').replace(',','.'));if(!value('fGrade')||!Number.isFinite(n)||n<1||n>10)return alert('Vul een cijfer van 1 tot 10 in.');test(m.id).grade=n}
if(m.type==='time'){const h=Number(v('fHours')),mi=Number(v('fMinutes')),se=Number(v('fSeconds'));if(![h,mi,se].every(Number.isInteger)||h<0||h>999||mi<0||mi>59||se<0||se>59||h+mi+se===0)return alert('Vul een geldige tijd groter dan nul in.');const seconds=h*3600+mi*60+se;if(m.id)db.sessions.find(x=>x.id===m.id).seconds=seconds;else db.sessions.push({id:uid(),testId,seconds,created:Date.now(),manual:true})}
modal=null;save();rewardCheck();render()}
function act(a){const [cmd,...rest]=a.split(':'),id=rest.join(':');if(cmd==='nav'){page=id;modal=null}if(cmd==='close'){modal=null}if(cmd==='nextReward'){if(queued.length)showReward();else render();return}if(cmd==='addSubject')openModal('subject');if(cmd==='editSubject')openModal('subject',id);if(cmd==='addTest'){if(!db.subjects.length){alert('Voeg eerst een vak toe.');openModal('subject')}else openModal('test')}if(cmd==='editTest')openModal('test',id);if(cmd==='grade')openModal('grade',id);if(cmd==='addTime')openModal('time');if(cmd==='editTime')openModal('time',id);if(cmd==='character')openModal('character');if(cmd==='chooseCharacter'){db.character=id;modal=null}if(cmd==='openTest'){testId=id;page='test'}if(cmd==='openSubject'){subjectId=id;page='subject'}if(cmd==='selectAnimal'){db.adventure.selected=id}
if(cmd==='clearGrade'&&confirm('Cijfer verwijderen?'))test(id).grade=null;
if(cmd==='deleteTime'&&confirm('Deze leersessie verwijderen?'))db.sessions=db.sessions.filter(x=>x.id!==id);
if(cmd==='deleteTest'&&confirm('Toets en alle bijbehorende leertijd verwijderen?')){if(timer?.testId===id){timer=null;storeTimer()}db.tests=db.tests.filter(x=>x.id!==id);db.sessions=db.sessions.filter(x=>x.testId!==id);page='home'}
if(cmd==='deleteSubject'&&confirm('Vak, alle toetsen, cijfers en leertijd verwijderen?')){const ids=db.tests.filter(x=>x.subjectId===id).map(x=>x.id);if(timer&&ids.includes(timer.testId)){timer=null;storeTimer()}db.subjects=db.subjects.filter(x=>x.id!==id);db.tests=db.tests.filter(x=>!ids.includes(x.id));db.sessions=db.sessions.filter(x=>!ids.includes(x.testId));page='subjects'}
if(cmd==='startTimer'){if(timer)return alert('Er loopt al een timer voor een andere toets.');timer={testId,start:Date.now()};storeTimer()}
if(cmd==='stopTimer'){if(!timer||timer.testId!==testId)return;const seconds=Math.floor(currentSeconds()*1000)/1000;if(seconds>0)db.sessions.push({id:uid(),testId:timer.testId,seconds,created:Date.now(),manual:false});timer=null;storeTimer();rewardCheck()}
if(cmd==='cancelTimer'){if(!confirm('Timer stoppen zonder deze sessie te bewaren?'))return;timer=null;storeTimer()}
if(cmd==='submit'){submit();return}save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='closeBackdrop'&&e.target!==b)return;act(b.dataset.act)});setInterval(()=>{const c=$('clock');if(c&&timer?.testId===testId)c.textContent=clock(currentSeconds())},350);save();render();})();
</script></body></html>
