function rewardCheck(){
 // Alleen volledig verstreken blokken van 600 seconden leveren een dier/groeistap op.
 const blocks=Math.floor(total()/600),a=db.animals;
 let earned=0;
 const fresh=[];
 while(a.claimed<blocks){
  a.claimed++;earned++;
  const selected=a.owned.find(x=>x.id===a.selected&&x.stage<2);
  if(selected&&a.claimed%2===0){selected.stage++;fresh.push(selected.id)}
  else{
   const notOwned=speciesNames.map((_,i)=>i).filter(i=>!a.owned.some(x=>x.species===i));
   const species=notOwned.length?choose(notOwned):Math.floor(Math.random()*speciesNames.length);
   const animal={id:uid(),species,stage:0};a.owned.push(animal);a.selected=animal.id;fresh.push(animal.id);
  }
 }
 if(earned){
  a.freshIds=[...new Set(fresh)];a.freshStages=Object.fromEntries(fresh.map(id=>{const x=a.owned.find(z=>z.id===id);return [id,x?.stage??0]}));
  queued.push({type:'animal',count:earned});
 }
 for(const t of db.tests){if(secs(t.id)>=goal(t)&&!a.goalClaims.includes(t.id)){
  a.goalClaims.push(t.id);
  queued.push({type:'goal',picture:goalCelebration,title:'Leerdoel behaald!',desc:'Geweldig! Je hebt 3 × 10 minuten geleerd!',celebration:true});
 }}
 save();
}
function bar(a,b){return `<div class="progress"><div class="fill" style="width:${Math.min(100,100*a/Math.max(1,b))}%"></div></div>`}function header(title,desc){return `<div class="hero"><h1>${title}</h1><div class="muted">${desc}</div></div>`}function button(txt,act,cls='alt'){return `<button class="${cls}" data-act="${esc(act)}">${txt}</button>`}function testCard(t){const s=sub(t.subjectId),n=days(t.date),m=secs(t.id),g=goal(t),parts=Math.floor(m/(Math.max(1,Number(t.goalMinutes)||10)*60));return `<div class="card"><div class="row"><div><h3>${esc(s?.name||'Vak')} · ${esc(t.name)}</h3><div class="muted">📅 ${date(t.date)}</div></div><span class="chip ${n<=2?'urgent':''}">${n>0?n+' dagen':n===0?'Vandaag':'Datum voorbij'}</span></div><div class="muted" style="margin-top:9px">⏱ ${fmt(m)} geleerd · ${Math.min(parts,3)} / 3 leerstappen</div>${bar(m,g)}<div class="actions">${button('📖 Leren','openTest:'+t.id)}</div></div>`}
function home(){let active=db.tests.filter(t=>!done(t)).sort((a,b)=>a.date.localeCompare(b.date));return header('✨ Mijn Toetsavontuur','Leer, verzamel magische dieren en laat ze groeien!')+`<div class="card"><div class="row"><div><b>🐉 Magische dieren</b><div class="muted">${db.animals.owned.length} dieren verzameld · iedere 10 minuten een verrassing</div></div>${button('Bekijk dieren','nav:collection')}</div></div><div class="row"><h2>📚 Mijn toetsen</h2>${button('＋ Toets','addTest','')}</div>`+(active.length?active.map(testCard).join(''):'<div class="card">🎉 Geen aankomende toetsen! Voeg een toets toe om te beginnen.</div>')+`<div class="actions">${button('＋ Vak toevoegen','addSubject')}${button('Vakken & resultaten','nav:subjects')}</div>`}
function animalImage(x){return `<img class="creature-image" src="${animalPictures[x.species][x.stage]}" alt="${esc(['Baby','Jonge','Volwassen'][x.stage]+' '+speciesNames[x.species])}">`}
function collection(){const a=db.animals,items=a.owned;const grouped=speciesNames.map((name,i)=>({name,i,animals:items.filter(x=>x.species===i)})).filter(g=>g.animals.length);return header('🐾 Magische dieren','Je verdient dieren door te leren!')+`<div class="card"><div class="row"><b>${grouped.length} soorten ontdekt</b>${button('🗑 Verzameling wissen','clearCollection','warn')}</div>${grouped.length?grouped.map(g=>{const max=Math.max(...g.animals.map(x=>x.stage));const selected=g.animals.find(x=>x.id===a.selected);const canGrow=g.animals.find(x=>x.stage<2);return `<section class="collection-species"><div class="row"><h3>${esc(g.name)}</h3>${selected?'<span class="chip">🌱 Groeit mee</span>':''}</div><div class="stages-row">${[0,1,2].map(stage=>{const unlocked=max>=stage;const isFresh=g.animals.some(x=>a.freshIds.includes(x.id)&&(a.freshStages?.[x.id]??x.stage)===stage);return `<div class="stage-cell ${isFresh?'fresh':''}">${unlocked?`<img src="${animalPictures[g.i][stage]}" alt="${['Baby','Jonge','Volwassen'][stage]} ${esc(g.name)}">`:'<div class="locked-stage">🔒</div>'}<div class="stage-label">${['Baby','Jonge','Volwassen'][stage]}</div></div>`}).join('')}</div>${canGrow?button(selected?'✓ Groeit mee':'Laat dit dier groeien','selectAnimal:'+canGrow.id):'<span class="chip">✨ Volwassen</span>'}</section>`}).join(''):'<p class="muted">Nog geen dieren. Leer 10 minuten voor je eerste beloning!</p>'}</div>`}
function subjects(){return header('📚 Mijn vakken','Cijfers, toetsen en totale leertijd')+`<div class="actions">${button('＋ Vak','addSubject','')}</div>`+db.subjects.map(s=>{const ts=db.tests.filter(t=>t.subjectId===s.id),grades=ts.filter(done).map(t=>Number(t.grade)).filter(Number.isFinite),sum=ts.reduce((a,t)=>a+secs(t.id),0);return `<div class="card"><div class="row"><h3>${esc(s.name)}</h3>${button('Bekijken','openSubject:'+s.id)}</div><div class="muted">⏱ ${fmt(sum)} · ${grades.length} cijfers · gemiddelde ${grades.length?(grades.reduce((a,b)=>a+b,0)/grades.length).toLocaleString('nl-NL',{maximumFractionDigits:2}):'—'}</div></div>`}).join('')}
function subjectPage(){const s=sub(subjectId);if(!s)return subjects();const ts=db.tests.filter(t=>t.subjectId===s.id).sort((a,b)=>b.date.localeCompare(a.date)),gs=ts.filter(done).map(t=>Number(t.grade)).filter(Number.isFinite);return header('📘 '+esc(s.name),'Resultaten en toetsen')+`<div class="card"><div class="row"><div><b>⏱ ${fmt(ts.reduce((a,t)=>a+secs(t.id),0))}</b><div class="muted">Totaal geleerd</div></div><div><b>${gs.length?(gs.reduce((a,b)=>a+b,0)/gs.length).toLocaleString('nl-NL',{maximumFractionDigits:2}):'—'}</b><div class="muted">Gemiddelde</div></div></div><div class="actions">${button('Vak wijzigen','editSubject:'+s.id)}${button('Vak verwijderen','deleteSubject:'+s.id,'warn')}</div></div><h2>Alle toetsen en resultaten</h2>`+ts.map(t=>`<div class="card"><div class="row"><div><b>${esc(t.name)}</b><div class="muted">${date(t.date)} · ⏱ ${fmt(secs(t.id))}</div></div><span class="chip">${done(t)?'Cijfer '+Number(t.grade).toLocaleString('nl-NL'):'Nog geen cijfer'}</span></div><div class="actions">${button('Openen','openTest:'+t.id)}</div></div>`).join('')+`<div class="actions">${button('＋ Toets','addTest')}</div>`}
function testPage(){const t=test(testId);if(!t)return home();const s=sub(t.subjectId),m=secs(t.id),g=goal(t),chunk=Math.max(1,Number(t.goalMinutes)||10)*60,steps=Math.floor(m/chunk),remain=Math.floor((chunk-m%chunk)/60);let sessions=db.sessions.filter(x=>x.testId===t.id).sort((a,b)=>(b.created||0)-(a.created||0));return header('📖 '+esc(t.name),esc(s?.name||'')+' · '+date(t.date))+`<div class="card"><div class="row"><h3>🎯 Jouw leerdoel</h3><span class="chip">${Math.min(steps,3)}/3 stappen</span></div><div><b>3 × 10 minuten</b></div>${bar(m,g)}<div class="steps">${Array.from({length:3},(_,i)=>`<span class="step ${i<steps?'got':''}">${i<steps?'⭐':'🔒'}</span>`).join('')}</div><div class="muted">${fmt(m)} geleerd · ${m>=g?'🏆 Leerdoel behaald!':'Nog '+fmt(g-m)+' tot je leerdoel'} </div><p class="muted">Resterende tijd telt mee: ${clock(m%chunk)} / ${clock(chunk)} richting de volgende leerstap.</p></div><div class="card"><h3>⏱ Leertimer</h3><div id="clock" class="timer">${timer?.testId===t.id?clock(currentSeconds()):'00:00:00'}</div><div class="actions" style="justify-content:center">${timer?.testId===t.id?button('⏹ Stop en bewaar','stopTimer',''):button('▶ Start leren','startTimer','')}${timer?.testId===t.id?button('Annuleer','cancelTimer','warn'):''}</div><p class="footnote">Alleen volledig verstreken minuten verschijnen als hele minuten. Ook overgebleven seconden blijven exact bewaard voor later. De timer gebruikt de echte verstreken tijd, ook als je scherm uit is.</p></div><div class="card"><div class="row"><h3>📝 Cijfer</h3><b>${done(t)?Number(t.grade).toLocaleString('nl-NL'):'Nog niet ingevuld'}</b></div><div class="actions">${button(done(t)?'Cijfer wijzigen':'Cijfer toevoegen','grade:'+t.id)}${done(t)?button('Cijfer wissen','clearGrade:'+t.id,'warn'):''}</div></div><div class="card"><div class="row"><h3>📒 Leersessies</h3>${button('＋ Tijd toevoegen','addTime')}</div>${sessions.map(x=>`<div class="line row"><div><b>${fmt(x.seconds)}</b><div class="muted">${new Date(x.created||Date.now()).toLocaleDateString('nl-NL')} · ${clock(x.seconds)}${x.manual?' · handmatig':''}</div></div><div class="actions">${button('✏️','editTime:'+x.id)}${button('🗑️','deleteTime:'+x.id,'warn')}</div></div>`).join('')||'<p class="muted">Nog geen leersessies.</p>'}</div><div class="actions">${button('Toets wijzigen','editTest:'+t.id)}${button('Toets verwijderen','deleteTest:'+t.id,'warn')}</div>`}
function render(){let html=page==='home'?home():page==='collection'?collection():page==='subjects'?subjects():page==='subject'?subjectPage():testPage();$('app').innerHTML=html;const nav=[['home','🏠','Toetsen'],['collection','🐉','Dieren'],['subjects','📚','Vakken']];$('nav').innerHTML=nav.map(([v,e,n])=>`<button class="${page===v?'active':''}" data-act="nav:${v}">${e}<br>${n}</button>`).join('');renderModal();showReward()}
function renderModal(){const o=$('overlay');if(!modal){o.innerHTML='';return}let m=modal,t=test(m.id),s=sub(m.id),sess=db.sessions.find(x=>x.id===m.id),content='',title='';if(m.type==='subject'){title=m.id?'Vak wijzigen':'Nieuw vak';content=`<label>Naam vak</label><input id="fName" maxlength="60" value="${esc(s?.name||'')}">`}
if(m.type==='test'){title=m.id?'Toets wijzigen':'Nieuwe toets';content=`<label>Vak</label><select id="fSubject">${db.subjects.map(s=>`<option value="${esc(s.id)}" ${(t?.subjectId||subjectId)===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><label>Naam toets</label><input id="fName" maxlength="80" value="${esc(t?.name||'')}"><label>Toetsdatum</label><input id="fDate" type="date" value="${esc(t?.date||today())}"><div class="card"><b>🎯 Vast leerdoel: 3 × 10 minuten</b><p class="muted">Na 30 minuten verschijnt een feestelijk plaatje. Iedere 10 volledige minuten levert daarnaast een magisch dier of groeistap op.</p></div>`}
if(m.type==='time'){title=m.id?'Leertijd wijzigen':'Leertijd toevoegen';const n=sess?.seconds||0;content=`<label>Uren</label><input id="fHours" type="number" min="0" max="999" step="1" value="${Math.floor(n/3600)}"><label>Minuten</label><input id="fMinutes" type="number" min="0" max="59" step="1" value="${Math.floor(n%3600/60)}"><label>Seconden</label><input id="fSeconds" type="number" min="0" max="59" step="1" value="${Math.floor(n%60)}"><p class="muted">Je kunt een bestaande sessie volledig vervangen of verwijderen.</p>`}
if(m.type==='grade'){title='Cijfer invoeren';content=`<label>Cijfer (1 t/m 10)</label><input id="fGrade" type="number" min="1" max="10" step="0.1" value="${done(t)?t.grade:''}">`}
if(m.type==='character'){title='Kies je avonturier';content=`<div class="grid">${[['🐉','Draakje'],['🦊','Vosje'],['🦉','Uiltje'],['🦎','Axolotl']].map(([e,n])=>`<button class="alt" data-act="chooseCharacter:${e}" style="font-size:20px">${e}<br><span class="tiny">${n}</span></button>`).join('')}</div>`}
o.innerHTML=`<div class="overlay" data-act="closeBackdrop"><div class="dialog" role="dialog" aria-modal="true"><h2>${title}</h2>${content}<div class="actions">${m.type==='character'?'':button('Opslaan','submit','')}${button('Annuleren','close')}</div></div></div>`}
function showReward(){if(modal||!queued.length)return;const r=queued.shift();const isAnimal=r.type==='animal';$('overlay').innerHTML=`<div class="overlay"><div class="dialog reward">${!isAnimal&&r.picture?`<img class="reward-picture ${r.celebration?'celebration-picture':''}" src="${r.picture}" alt="Feestelijke magische dieren">`:`<div class="big">🎁</div>`}<h2>🎉 ${isAnimal?'Beloning verdiend!':esc(r.title)}</h2><p>${isAnimal?'Bekijk je dierenverzameling!':esc(r.desc)}</p>${isAnimal?button('🐾 Naar dierenverzameling','viewRewards',''):button('Verder','nextReward','')}</div></div>`}
function openModal(type,id=null){modal={type,id};renderModal()}
function submit(){const v=id=>$(id)?.value, m=modal;if(!m)return;const value=id=>String(v(id)||'').trim();if(m.type==='subject'){const name=value('fName');if(!name)return alert('Vul een vaknaam in.');if(m.id)sub(m.id).name=name;else db.subjects.push({id:uid(),name,color:'#8465d9'})}
if(m.type==='test'){const name=value('fName'),dt=value('fDate'),subject=value('fSubject'),count=3,mins=10;if(!name||!dt||!subject)return alert('Vul alle gegevens goed in.');if(m.id)Object.assign(test(m.id),{name,date:dt,subjectId:subject,goalCount:count,goalMinutes:mins});else db.tests.push({id:uid(),name,date:dt,subjectId:subject,goalCount:count,goalMinutes:mins,grade:null})}
if(m.type==='grade'){const n=Number(value('fGrade').replace(',','.'));if(!value('fGrade')||!Number.isFinite(n)||n<1||n>10)return alert('Vul een cijfer van 1 tot 10 in.');test(m.id).grade=n}
if(m.type==='time'){const h=Number(v('fHours')),mi=Number(v('fMinutes')),se=Number(v('fSeconds'));if(![h,mi,se].every(Number.isInteger)||h<0||h>999||mi<0||mi>59||se<0||se>59||h+mi+se===0)return alert('Vul een geldige tijd groter dan nul in.');const seconds=h*3600+mi*60+se;if(m.id)db.sessions.find(x=>x.id===m.id).seconds=seconds;else db.sessions.push({id:uid(),testId,seconds,created:Date.now(),manual:true})}
modal=null;save();rewardCheck();render()}
function act(a){const [cmd,...rest]=a.split(':'),id=rest.join(':');if(cmd==='nav'){page=id;modal=null}if(cmd==='close'){modal=null}if(cmd==='nextReward'||cmd==='viewRewards'){$('overlay').innerHTML='';if(cmd==='viewRewards'){page='collection';queued=queued.filter(r=>r.type!=='animal')}if(queued.length)showReward();else render();return}if(cmd==='addSubject')openModal('subject');if(cmd==='editSubject')openModal('subject',id);if(cmd==='addTest'){if(!db.subjects.length){alert('Voeg eerst een vak toe.');openModal('subject')}else openModal('test')}if(cmd==='editTest')openModal('test',id);if(cmd==='grade')openModal('grade',id);if(cmd==='addTime')openModal('time');if(cmd==='editTime')openModal('time',id);if(cmd==='chooseCharacter'){db.character=id;modal=null}if(cmd==='openTest'){testId=id;page='test'}if(cmd==='openSubject'){subjectId=id;page='subject'}if(cmd==='selectAnimal'){db.animals.selected=id}if(cmd==='clearCollection'&&confirm('Alle magische dieren wissen? Je toetsen, cijfers en leertijd blijven bewaard.')){db.animals.owned=[];db.animals.selected=null;db.animals.freshIds=[];db.animals.freshStages={};db.animals.claimed=Math.floor(total()/600);queued=queued.filter(r=>r.type!=='animal');}
if(cmd==='clearGrade'&&confirm('Cijfer verwijderen?'))test(id).grade=null;
if(cmd==='deleteTime'&&confirm('Deze leersessie verwijderen?'))db.sessions=db.sessions.filter(x=>x.id!==id);
if(cmd==='deleteTest'&&confirm('Toets en alle bijbehorende leertijd verwijderen?')){if(timer?.testId===id){timer=null;storeTimer()}db.tests=db.tests.filter(x=>x.id!==id);db.sessions=db.sessions.filter(x=>x.testId!==id);page='home'}
if(cmd==='deleteSubject'&&confirm('Vak, alle toetsen, cijfers en leertijd verwijderen?')){const ids=db.tests.filter(x=>x.subjectId===id).map(x=>x.id);if(timer&&ids.includes(timer.testId)){timer=null;storeTimer()}db.subjects=db.subjects.filter(x=>x.id!==id);db.tests=db.tests.filter(x=>!ids.includes(x.id));db.sessions=db.sessions.filter(x=>!ids.includes(x.testId));page='subjects'}
if(cmd==='startTimer'){if(timer)return alert('Er loopt al een timer voor een andere toets.');timer={testId,start:Date.now()};storeTimer()}
if(cmd==='stopTimer'){if(!timer||timer.testId!==testId)return;const seconds=Math.floor(currentSeconds()*1000)/1000;if(seconds>0)db.sessions.push({id:uid(),testId:timer.testId,seconds,created:Date.now(),manual:false});timer=null;storeTimer();rewardCheck()}
if(cmd==='cancelTimer'){if(!confirm('Timer stoppen zonder deze sessie te bewaren?'))return;timer=null;storeTimer()}
if(cmd==='submit'){submit();return}save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='closeBackdrop'&&e.target!==b)return;act(b.dataset.act)});setInterval(()=>{const c=$('clock');if(c&&timer?.testId===testId)c.textContent=clock(currentSeconds())},350);save();render();})();
</script></body></html>
