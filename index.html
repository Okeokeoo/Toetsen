<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fc"><meta name="apple-mobile-web-app-capable" content="yes"><title>Mijn toetsen</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#222b42;background:#f6f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:20px 16px 110px}h1{font-size:28px;margin:4px 0 18px}h2{font-size:20px;margin:0 0 12px}.muted{color:#70788b;font-size:14px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:white;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 2px 12px #172e5810}.line{display:flex;align-items:center;justify-content:space-between;gap:12px}.grow{flex:1;min-width:0}.pill{border-radius:14px;padding:9px 12px;background:#eef2ff;color:#3955a4;font-weight:750;text-align:center;min-width:85px}.pill.urgent{background:#fff0ee;color:#b93f37}.pill.done{background:#e8f6ee;color:#257b4b}button{border:0;border-radius:12px;background:#5368d5;color:white;padding:12px 15px;font-size:15px;font-weight:650;cursor:pointer}button.secondary{background:#eef0fb;color:#3e51a9}button.danger{background:#fff0f0;color:#a83232}button.small{padding:8px 10px;font-size:13px}button:disabled{opacity:.45}input,select{width:100%;font:inherit;border:1px solid #d8deeb;border-radius:11px;padding:12px;background:white;color:#222b42}label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e7e9f2;display:flex;justify-content:center;padding:8px 8px max(10px,env(safe-area-inset-bottom));z-index:5}.nav button{background:none;color:#7a8194;flex:1;max-width:180px;padding:8px 2px;font-size:12px}.nav button.active{color:#445acb;background:#eff1ff}.nav span{display:block;font-size:22px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f2f4fb;border-radius:13px;padding:14px}.stat strong{display:block;font-size:24px;margin-top:6px}.entry{padding:12px 0;border-bottom:1px solid #eef0f4}.entry:last-child{border:0}.timer{font-size:42px;font-variant-numeric:tabular-nums;text-align:center;font-weight:750;margin:20px 0}.empty{text-align:center;color:#70788b;padding:28px 12px}.modal{position:fixed;inset:0;background:#11182790;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}.dialog{background:white;border-radius:20px;padding:20px;width:min(100%,470px);max-height:90dvh;overflow:auto}.dialog h2{margin:0}.hint{font-size:12px;color:#777f90;margin-top:6px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9aaaff} .name{font-weight:750;font-size:17px;overflow-wrap:anywhere}.sub{font-size:13px;color:#747c8e;margin-top:5px}.history{font-size:14px}.heading{margin-top:24px} .warning{color:#b93f37}
</style></head><body><main id="app"></main><nav class="nav" id="nav"></nav><div id="overlay"></div><script>
(()=>{'use strict';const KEY='toetsapp_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{subjects:[],tests:[],sessions:[]}}catch{db={subjects:[],tests:[],sessions:[]}}for(const k of ['subjects','tests','sessions'])if(!Array.isArray(db[k]))db[k]=[];
let view='home',selectedSubject=null,selectedTest=null,modal=null;let timer=null;const $=id=>document.getElementById(id),id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Opslaan is niet gelukt. Controleer de opslagruimte van je apparaat.')}},subject=id=>db.subjects.find(s=>s.id===id),test=id=>db.tests.find(t=>t.id===id),sessions=id=>db.sessions.filter(s=>s.testId===id),minutes=id=>sessions(id).reduce((n,s)=>n+Number(s.minutes||0),0),fmt=m=>{m=Math.round(m);return m>=60?`${Math.floor(m/60)}u ${m%60}m`:`${m} min`},day=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},days=s=>{const [y,m,d]=s.split('-').map(Number);const now=new Date(),today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());return Math.round((Date.UTC(y,m-1,d)-today)/86400000)},date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'}):'',grade=g=>g===null||g===undefined||g===''?'—':Number(g).toLocaleString('nl-NL',{maximumFractionDigits:2}),color=i=>['#5676cf','#a574c6','#db9a45','#4da79b','#e07587','#84994b'][i%6],dot=s=>`<span class="dot" style="background:${esc(s?.color||'#888')}"></span>`,tag=t=>{if(t.grade!==null&&t.grade!==undefined&&t.grade!=='')return `<div class="pill done">${grade(t.grade)}</div>`;let n=days(t.date);return `<div class="pill ${n<=2?'urgent':''}">${n>0?`${n} dagen`:n===0?'Vandaag': 'Voorbij'}</div>`},btn=(label,act,cls='secondary')=>`<button class="${cls} small" data-act="${act}">${label}</button>`,running=()=>timer!==null,elapsed=()=>timer?Math.max(0,Math.floor((Date.now()-timer.start)/1000)):0,clock=n=>[Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(x=>String(x).padStart(2,'0')).join(':');
function render(){const app=$('app');let html='';if(view==='home'){const upcoming=db.tests.filter(t=>t.grade===null||t.grade===undefined||t.grade==='').sort((a,b)=>a.date.localeCompare(b.date));html=`<div class="top"><h1>📚 Mijn toetsen</h1>${btn('＋ Vak','addSubject')}</div><div class="line"><h2>Aankomende toetsen</h2>${btn('＋ Toets','addTest')}</div>`;html+=upcoming.length?upcoming.map(t=>testCard(t)).join(''):'<div class="card empty">Nog geen aankomende toetsen. Voeg een toets toe!</div>';if(db.tests.some(t=>t.grade!==null&&t.grade!==undefined&&t.grade!==''))html+=`<h2 class="heading">Gemaakte toetsen</h2>`+db.tests.filter(t=>t.grade!==null&&t.grade!==undefined&&t.grade!=='').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(testCard).join('');}
if(view==='subjects'){html=`<div class="top"><h1>📘 Vakken</h1>${btn('＋ Vak','addSubject')}</div>`;html+=db.subjects.length?db.subjects.map(s=>{let ts=db.tests.filter(t=>t.subjectId===s.id),graded=ts.filter(t=>t.grade!==null&&t.grade!==undefined&&t.grade!=='');let avg=graded.length?graded.reduce((n,t)=>n+Number(t.grade),0)/graded.length:null;return `<div class="card"><div class="line"><div class="grow name">${dot(s)}${esc(s.name)}</div>${btn('Bekijk','openSubject:'+s.id)}</div><div class="sub">${ts.length} toetsen · ${fmt(ts.reduce((n,t)=>n+minutes(t.id),0))} geleerd · Gemiddelde: ${avg===null?'—':grade(avg)}</div><div class="actions">${btn('Wijzig','editSubject:'+s.id)}${btn('Verwijder','deleteSubject:'+s.id,'danger')}</div></div>`}).join(''):'<div class="card empty">Voeg je eerste vak toe.</div>';}
if(view==='subject'){const s=subject(selectedSubject);if(!s){view='subjects';return render()}const ts=db.tests.filter(t=>t.subjectId===s.id).sort((a,b)=>b.date.localeCompare(a.date)),graded=ts.filter(t=>t.grade!==null&&t.grade!==undefined&&t.grade!=='');const avg=graded.length?graded.reduce((n,t)=>n+Number(t.grade),0)/graded.length:null;html=`${btn('← Vakken','backSubjects')}<h1 style="margin-top:16px">${dot(s)}${esc(s.name)}</h1><div class="stats"><div class="stat"><span class="muted">Gemiddeld cijfer</span><strong>${avg===null?'—':grade(avg)}</strong></div><div class="stat"><span class="muted">Totaal geleerd</span><strong>${fmt(ts.reduce((n,t)=>n+minutes(t.id),0))}</strong></div></div><div class="top heading"><h2>Toetsen</h2>${btn('＋ Toets','addTest')}</div>`;html+=ts.length?ts.map(testCard).join(''):'<div class="card empty">Nog geen toetsen voor dit vak.</div>';}
if(view==='test'){const t=test(selectedTest);if(!t){view='home';return render()}const s=subject(t.subjectId),ss=sessions(t.id).sort((a,b)=>b.created-a.created);html=`${btn('← Terug','backTest')}<h1 style="margin-top:16px">${esc(t.name)}</h1><div class="card"><div class="line"><div><div class="name">${dot(s)}${esc(s?.name||'Onbekend vak')}</div><div class="sub">${date(t.date)}</div></div>${tag(t)}</div><div class="stats" style="margin-top:16px"><div class="stat"><span class="muted">Geleerd</span><strong>${fmt(minutes(t.id))}</strong></div><div class="stat"><span class="muted">Cijfer</span><strong>${grade(t.grade)}</strong></div></div><div class="actions">${btn('Wijzig toets','editTest:'+t.id)}${btn('Cijfer invoeren / wijzigen','setGrade:'+t.id)}${btn('Verwijder toets','deleteTest:'+t.id,'danger')}</div></div><div class="card"><h2>⏱️ Leren</h2><div class="timer" id="clock">${clock(elapsed())}</div><div class="actions" style="justify-content:center">${running()&&timer.testId===t.id?`${btn('Stop en bewaar','stopTimer','')}${btn('Annuleer timer','cancelTimer','danger')}`:btn('Start timer','startTimer','')}</div>${running()&&timer.testId!==t.id?'<p class="warning">Er loopt al een timer bij een andere toets.</p>':''}<div class="actions">${btn('＋ Tijd handmatig toevoegen','addTime:'+t.id)}</div><p class="hint">De timer telt verder als het scherm uitgaat. Stop hem om de leertijd op te slaan.</p></div><div class="card"><h2>Leersessies</h2>`;html+=ss.length?ss.map(e=>`<div class="entry"><div class="line"><div class="history"><strong>${fmt(e.minutes)}</strong><div class="sub">${new Date(e.created).toLocaleDateString('nl-NL')} · ${e.manual?'Handmatig':'Timer'}</div></div><div class="actions" style="margin:0">${btn('Wijzig','editTime:'+e.id)}${btn('Wis','deleteTime:'+e.id,'danger')}</div></div></div>`).join(''):'<div class="empty">Nog geen leertijd geregistreerd.</div>';html+='</div>';}
app.innerHTML=html;const tabs=[['home','🏠','Toetsen'],['subjects','📘','Vakken']];$('nav').innerHTML=tabs.map(([v,ico,name])=>`<button data-act="nav:${v}" class="${view===v||(v==='subjects'&&view==='subject')?'active':''}"><span>${ico}</span>${name}</button>`).join('');renderModal();}
function testCard(t){const s=subject(t.subjectId);return `<div class="card"><div class="line"><div class="grow"><div class="name">${dot(s)}${esc(s?.name||'Onbekend vak')}</div><div class="sub">${esc(t.name)} · ${date(t.date)}</div><div class="sub">⏱ ${fmt(minutes(t.id))} geleerd</div></div>${tag(t)}</div><div class="actions">${btn('Bekijken','openTest:'+t.id)}</div></div>`}
function renderModal(){const root=$('overlay');if(!modal){root.innerHTML='';return}let body='',title='',buttons='';const m=modal,edit=m.id;const s=subject(edit),t=test(edit),e=db.sessions.find(x=>x.id===edit);if(m.type==='subject'){title=edit?'Vak wijzigen':'Vak toevoegen';body=`<label for="fName">Naam vak</label><input id="fName" maxlength="60" required value="${esc(s?.name||'')}"><label for="fColor">Kleur</label><select id="fColor">${['#5676cf','#a574c6','#db9a45','#4da79b','#e07587','#84994b'].map((c,i)=>`<option value="${c}" ${c===(s?.color||color(db.subjects.length))?'selected':''}>Kleur ${i+1}</option>`).join('')}</select>`}
if(m.type==='test'){title=edit?'Toets wijzigen':'Toets toevoegen';body=`<label for="fSubject">Vak</label><select id="fSubject">${db.subjects.map(x=>`<option value="${esc(x.id)}" ${x.id===(t?.subjectId||m.subjectId)?'selected':''}>${esc(x.name)}</option>`).join('')}</select><label for="fName">Naam toets</label><input id="fName" maxlength="100" required value="${esc(t?.name||'')}"><label for="fDate">Datum</label><input id="fDate" type="date" required value="${esc(t?.date||day())}">`}
if(m.type==='grade'){title='Cijfer invoeren / wijzigen';body=`<label for="fGrade">Cijfer (1 t/m 10)</label><input id="fGrade" type="text" inputmode="decimal" placeholder="Bijvoorbeeld 7,5" value="${t?.grade===null||t?.grade===undefined?'':esc(String(t.grade).replace('.',','))}"><p class="hint">Laat het veld leeg om het cijfer te verwijderen.</p>`}
if(m.type==='time'){title=edit?'Leertijd wijzigen':'Leertijd toevoegen';const n=e?.minutes||0;body=`<label for="fHours">Uren</label><input id="fHours" type="number" min="0" max="999" step="1" value="${Math.floor(n/60)}"><label for="fMinutes">Minuten</label><input id="fMinutes" type="number" min="0" max="59" step="1" value="${n%60}"><p class="hint">Bij wijzigen wordt de bestaande leersessie vervangen, niet opgeteld.</p>`}
root.innerHTML=`<div class="modal"><form class="dialog" id="modalForm"><h2>${title}</h2>${body}<div class="actions"><button type="submit">Opslaan</button><button type="button" class="secondary" data-act="close">Annuleren</button></div></form></div>`;setTimeout(()=>$('fName')?.focus(),0)}
function openModal(type,id=null,subjectId=null){modal={type,id,subjectId};renderModal()}
function submit(){const m=modal;if(!m)return;const val=id=>$(id)?.value.trim();if(m.type==='subject'){const name=val('fName');if(!name)return alert('Vul een vaknaam in.');if(m.id){Object.assign(subject(m.id),{name,color:val('fColor')})}else db.subjects.push({id:id(),name,color:val('fColor')})}
if(m.type==='test'){const name=val('fName'),dateValue=val('fDate'),subjectId=val('fSubject');if(!name||!dateValue||!subjectId)return alert('Vul alle velden in.');if(m.id)Object.assign(test(m.id),{name,date:dateValue,subjectId});else db.tests.push({id:id(),name,date:dateValue,subjectId,grade:null})}
if(m.type==='grade'){const raw=val('fGrade').replace(',','.');if(raw!==''&&(!/^\d+(\.\d{1,2})?$/.test(raw)||Number(raw)<1||Number(raw)>10))return alert('Vul een cijfer tussen 1 en 10 in.');test(m.id).grade=raw===''?null:Number(raw)}
if(m.type==='time'){const h=Number(val('fHours')),min=Number(val('fMinutes'));if(!Number.isInteger(h)||h<0||h>999||!Number.isInteger(min)||min<0||min>59||h*60+min===0)return alert('Vul een geldige tijd groter dan 0 in.');if(m.id){eFix(m.id,h*60+min)}else db.sessions.push({id:id(),testId:m.subjectId,minutes:h*60+min,created:Date.now(),manual:true})}
modal=null;save();render()}
function eFix(eid,n){const e=db.sessions.find(x=>x.id===eid);if(e)e.minutes=n}
function act(a){const [cmd,...parts]=a.split(':'),v=parts.join(':');if(cmd==='nav'){view=v;render();return}if(cmd==='close'){modal=null;render();return}if(cmd==='addSubject'){openModal('subject');return}if(cmd==='editSubject'){openModal('subject',v);return}if(cmd==='addTest'){if(!db.subjects.length){alert('Voeg eerst een vak toe.');openModal('subject');return}openModal('test',null,view==='subject'?selectedSubject:null);return}if(cmd==='editTest'){openModal('test',v);return}if(cmd==='setGrade'){openModal('grade',v);return}if(cmd==='addTime'){openModal('time',null,v);return}if(cmd==='editTime'){openModal('time',v);return}if(cmd==='openTest'){selectedTest=v;view='test';render();return}if(cmd==='openSubject'){selectedSubject=v;view='subject';render();return}if(cmd==='backSubjects'){view='subjects';render();return}if(cmd==='backTest'){view=selectedSubject&&subject(selectedSubject)?'subject':'home';render();return}if(cmd==='deleteSubject'){if(!confirm('Dit vak en ALLE bijbehorende toetsen, cijfers en leersessies verwijderen?'))return;const ids=db.tests.filter(t=>t.subjectId===v).map(t=>t.id);if(timer&&ids.includes(timer.testId))timer=null;db.subjects=db.subjects.filter(s=>s.id!==v);db.tests=db.tests.filter(t=>t.subjectId!==v);db.sessions=db.sessions.filter(e=>!ids.includes(e.testId));view='subjects'}if(cmd==='deleteTest'){if(!confirm('Deze toets, het cijfer en alle leersessies verwijderen?'))return;if(timer?.testId===v)timer=null;db.tests=db.tests.filter(t=>t.id!==v);db.sessions=db.sessions.filter(e=>e.testId!==v);view='home'}if(cmd==='deleteTime'){if(!confirm('Deze leersessie verwijderen?'))return;db.sessions=db.sessions.filter(e=>e.id!==v)}if(cmd==='startTimer'){if(timer)return alert('Er loopt al een timer bij een andere toets.');timer={testId:selectedTest,start:Date.now()};storeTimer()}if(cmd==='stopTimer'){if(!timer||timer.testId!==selectedTest)return;const n=Math.max(1,Math.ceil(elapsed()/60));db.sessions.push({id:id(),testId:timer.testId,minutes:n,created:Date.now(),manual:false});timer=null;storeTimer()}if(cmd==='cancelTimer'){if(!confirm('De lopende timer annuleren zonder tijd op te slaan?'))return;timer=null;storeTimer()}save();render()}
function storeTimer(){try{if(timer)localStorage.setItem(KEY+'_timer',JSON.stringify(timer));else localStorage.removeItem(KEY+'_timer')}catch{}}
try{const saved=JSON.parse(localStorage.getItem(KEY+'_timer'));if(saved&&test(saved.testId)&&Number.isFinite(saved.start)&&saved.start<=Date.now())timer=saved}catch{}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(b)act(b.dataset.act)});document.addEventListener('submit',ev=>{if(ev.target.id==='modalForm'){ev.preventDefault();submit()}});setInterval(()=>{if(view==='test'&&timer?.testId===selectedTest&&$('clock'))$('clock').textContent=clock(elapsed())},1000);render();})();
</script></body></html>
